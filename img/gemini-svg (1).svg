<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- 天空背景渐变 -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <!-- 鹈鹕喉囊渐变 -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <!-- 车架渐变 -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- 天空背景 -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- 动态远景云朵（向后缓慢飘动） -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M 110 130 Q 130 100 160 115 Q 190 90 220 115 Q 250 110 260 135 Q 265 150 240 150 L 115 150 Q 95 150 110 130 Z">
      <animateTransform attributeName="transform" type="translate" from="750 0" to="-350 0" dur="14s" repeatCount="indefinite" />
    </path>
    <path d="M 580 95 Q 600 70 630 85 Q 660 65 685 90 Q 710 90 715 110 L 575 110 Q 565 105 580 95 Z">
      <animateTransform attributeName="transform" type="translate" from="350 0" to="-750 0" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- 地面与滚动路面线条 -->
  <line x1="40" y1="518" x2="760" y2="518" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
  <line x1="60" y1="528" x2="740" y2="528" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="30, 90">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.45s" repeatCount="indefinite" />
  </line>
  <!-- 车身底部动态阴影 -->
  <ellipse cx="400" cy="518" rx="240" ry="7" fill="#94a3b8" opacity="0.35">
    <animate attributeName="rx" values="240;232;240" dur="0.6s" repeatCount="indefinite" />
  </ellipse>

  <!-- ==================== 后侧左腿与左踏板（相位 180°） ==================== -->
  <!-- 左曲柄 -->
  <line x1="365" y1="430" x2="329" y2="430" stroke="#64748b" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="329;340;365;390;401;390;365;340;329" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="y2" values="430;405;394;405;430;455;466;455;430" dur="1.2s" repeatCount="indefinite" />
  </line>
  <!-- 鹈鹕左腿 -->
  <polyline points="320,282 362,345 329,430" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="points"
      values="320,282 362,345 329,430;
              320,285 375,325 340,405;
              320,282 392,318 365,394;
              320,279 402,325 390,405;
              320,282 398,338 401,430;
              320,285 388,360 390,455;
              320,282 372,372 365,466;
              320,279 358,365 340,455;
              320,282 362,345 329,430"
      dur="1.2s" repeatCount="indefinite" />
  </polyline>
  <!-- 左脚蹼与左踏板（随左曲柄末端平移，始终保持水平） -->
  <g>
    <path d="M -14,0 L 24,0 L 12,-11 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="-18" y="0" width="36" height="8" rx="4" fill="#334155" />
    <animateTransform attributeName="transform" type="translate"
      values="329,430; 340,405; 365,394; 390,405; 401,430; 390,455; 365,466; 340,455; 329,430"
      dur="1.2s" repeatCount="indefinite" />
  </g>

  <!-- ==================== 自行车前后轮（高速旋转） ==================== -->
  <!-- 后轮 (圆心: 220, 430) -->
  <g>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="140" y1="430" x2="300" y2="430" />
      <line x1="220" y1="350" x2="220" y2="510" />
      <line x1="164" y1="374" x2="276" y2="486" />
      <line x1="164" y1="486" x2="276" y2="374" />
      <line x1="146" y1="400" x2="294" y2="460" />
      <line x1="190" y1="356" x2="250" y2="504" />
      <line x1="146" y1="460" x2="294" y2="400" />
      <line x1="190" y1="504" x2="250" y2="356" />
    </g>
    <!-- 气门嘴（便于观察旋转） -->
    <rect x="217" y="356" width="6" height="12" rx="2" fill="#ef4444" />
    <circle cx="220" cy="430" r="76" fill="none" stroke="#e2e8f0" stroke-width="5" />
    <circle cx="220" cy="430" r="83" fill="none" stroke="#1e293b" stroke-width="11" stroke-dasharray="26, 8" />
    <circle cx="220" cy="430" r="10" fill="#475569" />
    <animateTransform attributeName="transform" type="rotate" from="0 220 430" to="360 220 430" dur="1.1s" repeatCount="indefinite" />
  </g>

  <!-- 前轮 (圆心: 570, 430) -->
  <g>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="490" y1="430" x2="650" y2="430" />
      <line x1="570" y1="350" x2="570" y2="510" />
      <line x1="514" y1="374" x2="626" y2="486" />
      <line x1="514" y1="486" x2="626" y2="374" />
      <line x1="496" y1="400" x2="644" y2="460" />
      <line x1="540" y1="356" x2="600" y2="504" />
      <line x1="496" y1="460" x2="644" y2="400" />
      <line x1="540" y1="504" x2="600" y2="356" />
    </g>
    <!-- 气门嘴 -->
    <rect x="567" y="356" width="6" height="12" rx="2" fill="#ef4444" />
    <circle cx="570" cy="430" r="76" fill="none" stroke="#e2e8f0" stroke-width="5" />
    <circle cx="570" cy="430" r="83" fill="none" stroke="#1e293b" stroke-width="11" stroke-dasharray="26, 8" />
    <circle cx="570" cy="430" r="10" fill="#475569" />
    <animateTransform attributeName="transform" type="rotate" from="0 570 430" to="360 570 430" dur="1.1s" repeatCount="indefinite" />
  </g>

  <!-- 动态链条 -->
  <path d="M 220 420 L 365 408 A 22 22 0 1 1 365 452 L 220 440 A 10 10 0 1 1 220 420 Z" fill="none" stroke="#475569" stroke-width="3.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.25s" repeatCount="indefinite" />
  </path>

  <!-- ==================== 自行车车架与车把 ==================== -->
  <g stroke="url(#frameGrad)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="220,430 295,295 365,430" />
    <polyline points="295,295 500,285 365,430" />
    <line x1="492" y1="265" x2="570" y2="430" />
  </g>

  <g stroke="#475569" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="295" y1="295" x2="285" y2="270" stroke-width="8" />
    <path d="M 492 265 L 478 220 Q 472 202 450 205 L 425 208" stroke-width="8" />
    <line x1="440" y1="206" x2="412" y2="210" stroke="#0f172a" stroke-width="13" />
  </g>
  <path d="M 255 268 Q 285 260 322 270 Q 305 284 265 280 Z" fill="#1e293b" />

  <!-- 中轴旋转牙盘 -->
  <g>
    <circle cx="365" cy="430" r="24" fill="#cbd5e1" stroke="#475569" stroke-width="5" />
    <line x1="345" y1="430" x2="385" y2="430" stroke="#475569" stroke-width="4" />
    <line x1="365" y1="410" x2="365" y2="450" stroke="#475569" stroke-width="4" />
    <circle cx="365" cy="430" r="8" fill="#334155" />
    <animateTransform attributeName="transform" type="rotate" from="0 365 430" to="360 365 430" dur="1.2s" repeatCount="indefinite" />
  </g>

  <!-- ==================== 鹈鹕身体躯干（随踩踏律动颠簸） ==================== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0; 0,-6; 0,0" dur="1.2s" repeatCount="indefinite" />

    <!-- 尾羽摆动 -->
    <g>
      <path d="M 248 250 L 205 235 L 220 255 L 200 268 L 252 272 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3" stroke-linejoin="round" />
      <animateTransform attributeName="transform" type="rotate" values="0 250 260; -5 250 260; 0 250 260; 4 250 260; 0 250 260" dur="0.6s" repeatCount="indefinite" />
    </g>

    <!-- 主躯干与脖颈 -->
    <path d="M 250 255
             C 245 205, 305 185, 355 205
             C 375 212, 385 180, 378 145
             C 372 115, 375 82, 408 78
             C 438 75, 448 98, 442 122
             C 435 148, 412 162, 415 205
             C 418 252, 382 292, 325 288
             C 278 285, 252 275, 250 255 Z"
          fill="#ffffff" stroke="#334155" stroke-width="4" stroke-linejoin="round" />

    <!-- 迎风飘动的头顶呆毛 -->
    <g>
      <path d="M 395 80 Q 375 62 365 70 Q 382 75 385 83" fill="#ffffff" stroke="#334155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 405 78 Q 392 55 380 60 Q 395 68 396 80" fill="#ffffff" stroke="#334155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <animateTransform attributeName="transform" type="rotate" values="0 395 80; -8 395 80; 0 395 80" dur="0.35s" repeatCount="indefinite" />
    </g>

    <!-- 腹部浅灰阴影 -->
    <path d="M 262 262 C 295 285, 365 282, 398 242 C 382 278, 315 288, 262 262 Z" fill="#e2e8f0" />

    <!-- 鹈鹕大嘴与晃动的喉囊 -->
    <g stroke="#334155" stroke-width="3.5" stroke-linejoin="round">
      <!-- 巨大橙色喉囊（带弹性形变动画） -->
      <path d="M 438 112 C 438 168, 495 198, 555 160 C 578 145, 588 122, 585 112 Z" fill="url(#pouchGrad)">
        <animate attributeName="d"
          values="M 438 112 C 438 168, 495 198, 555 160 C 578 145, 588 122, 585 112 Z;
                  M 438 112 C 438 178, 498 208, 558 166 C 580 148, 588 122, 585 112 Z;
                  M 438 112 C 438 168, 495 198, 555 160 C 578 145, 588 122, 585 112 Z"
          dur="0.6s" repeatCount="indefinite" />
      </path>
      <!-- 喉囊褶皱纹理 -->
      <path d="M 455 125 Q 495 162 552 135" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 472 142 Q 505 170 545 150" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" />

      <!-- 上喙 -->
      <path d="M 436 96 L 586 105 C 594 106, 595 115, 586 118 L 582 114 L 436 112 Z" fill="#fde047" />
    </g>

    <!-- 眼睛 -->
    <circle cx="422" cy="98" r="10" fill="#fef08a" stroke="#334155" stroke-width="2.5" />
    <circle cx="424" cy="98" r="5" fill="#0f172a" />
    <circle cx="426" cy="96" r="2" fill="#ffffff" />

    <!-- 运动头带与随风飘动的飘带 -->
    <path d="M 386 88 Q 412 80 438 86" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <path d="M 386 88 Q 355 82 340 92" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d"
        values="M 386 88 Q 355 82 340 92;
                M 386 88 Q 355 95 338 84;
                M 386 88 Q 355 82 340 92"
        dur="0.3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- ==================== 前侧右腿与右踏板（相位 0°） ==================== -->
  <!-- 鹈鹕右腿 -->
  <polyline points="320,282 398,338 401,430" fill="none" stroke="#fb923c" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="points"
      values="320,282 398,338 401,430;
              320,285 388,360 390,455;
              320,282 372,372 365,466;
              320,279 358,365 340,455;
              320,282 362,345 329,430;
              320,285 375,325 340,405;
              320,282 392,318 365,394;
              320,279 402,325 390,405;
              320,282 398,338 401,430"
      dur="1.2s" repeatCount="indefinite" />
  </polyline>
  <!-- 右曲柄 -->
  <line x1="365" y1="430" x2="401" y2="430" stroke="#94a3b8" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="401;390;365;340;329;340;365;390;401" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="y2" values="430;455;466;455;430;405;394;405;430" dur="1.2s" repeatCount="indefinite" />
  </line>
  <!-- 右脚蹼与右踏板 -->
  <g>
    <path d="M -14,0 L 24,0 L 12,-11 Z" fill="#fb923c" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="-18" y="0" width="38" height="9" rx="4" fill="#1e293b" />
    <animateTransform attributeName="transform" type="translate"
      values="401,430; 390,455; 365,466; 340,455; 329,430; 340,405; 365,394; 390,405; 401,430"
      dur="1.2s" repeatCount="indefinite" />
  </g>

  <!-- ==================== 鹈鹕翅膀（前伸握把并轻微耸动） ==================== -->
  <g>
    <path d="M 312 220
             C 335 198, 385 195, 426 208
             C 432 212, 428 224, 416 223
             C 402 222, 388 232, 362 242
             C 332 252, 295 245, 312 220 Z"
          fill="#f8fafc" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
    <path d="M 398 203 C 415 206, 428 210, 426 218 C 418 224, 405 222, 392 218 Z" fill="#334155" />
    <path d="M 330 228 Q 365 230 395 215" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <path d="M 325 238 Q 355 240 382 228" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <animateTransform attributeName="transform" type="rotate" values="0 420 210; 2.5 420 210; 0 420 210; 2.5 420 210; 0 420 210" dur="1.2s" repeatCount="indefinite" />
  </g>

  <!-- ==================== 动态速度线 ==================== -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="85" y1="230" x2="155" y2="230">
      <animate attributeName="x1" values="170; 40" dur="0.45s" repeatCount="indefinite" />
      <animate attributeName="x2" values="230; 90" dur="0.45s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.7; 0" dur="0.45s" repeatCount="indefinite" />
    </line>
    <line x1="95" y1="265" x2="145" y2="265">
      <animate attributeName="x1" values="180; 60" dur="0.35s" repeatCount="indefinite" />
      <animate attributeName="x2" values="225; 105" dur="0.35s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.6; 0" dur="0.35s" repeatCount="indefinite" />
    </line>
    <line x1="55" y1="430" x2="105" y2="430">
      <animate attributeName="x1" values="130; 20" dur="0.4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="180; 70" dur="0.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.7; 0" dur="0.4s" repeatCount="indefinite" />
    </line>
  </g>
</svg>
